<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unique Children's School — Connection Check</title>
<link rel="icon" type="image/png" href="/report_assets/favicon.png?v=2">
<link rel="stylesheet" href="/report_assets/fonts/dm-fonts.css">
<style>
/* The exam server's connection check (EXAM_MODE /check): same look as the pupil sign-in */
:root {
  --white: #ffffff; --bg: #f8fafc; --field: #f1f5f9; --border: #e2e8f0; --border-2: #cbd5e1;
  --green: #16a34a; --green-bg: rgba(22,163,74,0.08); --red: #dc2626; --red-bg: rgba(220,38,38,0.08);
  --amber: #d97706; --amber-bg: rgba(217,119,6,0.10);
  --text-1: #0f172a; --text-2: #475569; --text-3: #94a3b8; --radius-sm: 8px; --radius: 14px;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { font-size:14px; }
body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text-1); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; -webkit-font-smoothing:antialiased; }
.card { width:100%; max-width:440px; background:var(--white); border:1px solid var(--border); border-radius:var(--radius); box-shadow:0 4px 24px rgba(15,23,42,0.08); overflow:hidden; }
.top { padding:30px 32px 22px; display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; border-bottom:1px solid var(--border); }
.top img { height:60px; width:auto; object-fit:contain; }
.top .name { font-size:16px; font-weight:700; letter-spacing:-0.3px; }
.top .sub { font-size:10px; color:var(--text-3); font-weight:500; letter-spacing:0.7px; text-transform:uppercase; font-family:'DM Mono',monospace; }
.body { padding:24px 32px 28px; }
.status { display:flex; align-items:center; gap:14px; padding:16px; border-radius:var(--radius-sm); background:var(--field); }
.status .dot { flex:0 0 auto; width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:700; color:#fff; background:var(--text-3); }
.status b { display:block; font-size:17px; }
.status span { font-size:13px; color:var(--text-2); }
.status.good { background:var(--green-bg); } .status.good .dot { background:var(--green); }
.status.warn { background:var(--amber-bg); } .status.warn .dot { background:var(--amber); }
.status.bad { background:var(--red-bg); } .status.bad .dot { background:var(--red); }
.facts { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:16px 0; }
.fact { border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; }
.fact small { display:block; font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:0.3px; color:var(--text-3); margin-bottom:3px; }
.fact b { font-size:15px; font-family:'DM Mono',monospace; }
.track { height:6px; background:var(--field); border-radius:6px; overflow:hidden; }
.track i { display:block; height:100%; width:0; background:var(--green); transition:width 0.5s linear; }
.hint { font-size:12px; color:var(--text-3); margin-top:8px; }
.actions { display:flex; gap:10px; margin-top:18px; }
.actions a, .actions button { flex:1; text-align:center; text-decoration:none; border-radius:var(--radius-sm); padding:12px; font-family:inherit; font-size:14px; font-weight:700; cursor:pointer; }
.btn-main { background:var(--green); color:#fff; border:none; }
.btn-main:disabled { opacity:0.6; cursor:not-allowed; }
.btn-plain { background:var(--white); color:var(--text-1); border:1px solid var(--border-2); }
</style>
<link rel="stylesheet" href="/no-select.css">
</head>
<body>
<div class="card">
  <div class="top">
    <img src="/report_assets/school-logo.png" alt="Unique Group of Schools">
    <div class="name">Unique Children's School</div>
    <div class="sub">Exam Server · Connection Check</div>
  </div>
  <div class="body">
    <div class="status" id="status"><span class="dot" id="dot">…</span><div><b id="headline">Checking the connection…</b><span id="detail">This takes one minute. Keep this page open.</span></div></div>
    <div class="facts">
      <div class="fact"><small>Connected by</small><b id="via">—</b></div>
      <div class="fact"><small>This computer</small><b id="ip">—</b></div>
      <div class="fact"><small>Speed (average)</small><b id="avg">—</b></div>
      <div class="fact"><small>Dropped checks</small><b id="drops">—</b></div>
    </div>
    <div class="track"><i id="bar"></i></div>
    <div class="hint" id="count">0 of 60 checks</div>
    <div class="actions">
      <button type="button" class="btn-main" id="again" disabled>Check again</button>
      <a class="btn-plain" href="/signin">Go to sign in</a>
    </div>
  </div>
</div>
<script src="exam-check.js"></script>
</body>
</html>
