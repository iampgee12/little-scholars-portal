<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBT — Unique Children's School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --black:    #ffffff;
    --black-2:  #f8fafc;
    --black-3:  #f1f5f9;
    --black-4:  #e2e8f0;
    --border:   #e2e8f0;
    --border-2: #cbd5e1;
    --green:    #16a34a;
    --green-bg: rgba(22,163,74,0.08);
    --red:      #dc2626;
    --red-bg:   rgba(220,38,38,0.08);
    --amber:    #d97706;
    --amber-bg: rgba(217,119,6,0.08);
    --blue:     #2563eb;
    --blue-bg:  rgba(37,99,235,0.08);
    --text-1:   #0f172a;
    --text-2:   #475569;
    --text-3:   #94a3b8;
    --radius-sm: 6px;
    --radius:    10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'DM Sans', sans-serif; background: var(--black-2); color: var(--text-1); }
  header.cbt-header {
    position: sticky; top: 0; z-index: 20;
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 22px; background: var(--black); border-bottom: 1px solid var(--border);
  }
  .cbt-header-left { display: flex; align-items: center; gap: 10px; font-weight: 700; }
  .cbt-logo { width: 30px; height: 30px; border-radius: 8px; background: var(--blue); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; font-family: 'DM Mono', monospace; }
  .cbt-header-right { display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--text-2); }
  .cbt-link-btn { background: none; border: 1px solid var(--border-2); border-radius: var(--radius-sm); padding: 7px 12px; font-size: 12px; font-family: inherit; color: var(--text-2); cursor: pointer; text-decoration: none; }
  .cbt-link-btn:hover { background: var(--black-3); }
  main { max-width: 900px; margin: 0 auto; padding: 26px 20px 60px; }
  h1 { font-size: 19px; margin: 0 0 4px; }
  .cbt-sub { color: var(--text-2); font-size: 13px; margin: 0 0 20px; }
  .cbt-exam-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .cbt-exam-card { background: var(--black); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .cbt-exam-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; font-size: 15px; }
  .cbt-muted { color: var(--text-3); font-size: 12px; }
  .cbt-badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 20px; font-family: 'DM Mono', monospace; white-space: nowrap; }
  .cbt-badge-live { background: var(--green-bg); color: var(--green); }
  .cbt-badge-upcoming { background: var(--amber-bg); color: var(--amber); }
  .cbt-badge-closed { background: var(--black-3); color: var(--text-3); }
  .cbt-badge-done { background: var(--blue-bg); color: var(--blue); }
  .cbt-exam-card-foot { margin-top: 6px; }
  .cbt-btn { background: var(--blue); color: #fff; border: none; border-radius: var(--radius-sm); padding: 9px 16px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; }
  .cbt-btn:hover { opacity: .92; }
  .cbt-score { font-family: 'DM Mono', monospace; font-weight: 700; font-size: 14px; }
  .cbt-empty { text-align: center; color: var(--text-3); padding: 50px 20px; }

  .cbt-exam-bar { position: sticky; top: 61px; z-index: 15; display: flex; justify-content: space-between; align-items: center; background: var(--black); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 18px; margin-bottom: 16px; }
  #cbt-exam-title { font-weight: 700; font-size: 14px; }
  .cbt-timer { font-family: 'DM Mono', monospace; font-size: 18px; font-weight: 700; color: var(--red); background: var(--red-bg); padding: 6px 14px; border-radius: var(--radius-sm); }
  .cbt-question-card { background: var(--black); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 12px; }
  .cbt-question-text { font-size: 14px; margin-bottom: 10px; line-height: 1.5; }
  .cbt-options { display: flex; flex-direction: column; gap: 8px; }
  .cbt-option { display: flex; align-items: center; gap: 10px; font-size: 13px; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; }
  .cbt-option:hover { background: var(--black-3); }
  .cbt-submit-btn { display: block; width: 100%; background: var(--green); color: #fff; border: none; border-radius: var(--radius); padding: 14px; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer; margin-top: 10px; }

  .cbt-result-card { background: var(--black); border: 1px solid var(--border); border-radius: var(--radius); padding: 40px 24px; text-align: center; max-width: 420px; margin: 40px auto; }
  .cbt-result-big { font-family: 'DM Mono', monospace; font-size: 40px; font-weight: 700; color: var(--blue); margin: 14px 0 6px; }
</style>
</head>
<body>
  <header class="cbt-header">
    <div class="cbt-header-left"><span class="cbt-logo">CBT</span><span>Computer Based Test</span></div>
    <div class="cbt-header-right">
      <span id="cbt-student-name"></span>
      <a href="student-portal.html" class="cbt-link-btn">&larr; Back to Portal</a>
      <button class="cbt-link-btn" onclick="signOut()">Sign Out</button>
    </div>
  </header>
  <main>
    <div id="cbt-list-view">
      <h1>Available CBT Exams</h1>
      <p class="cbt-sub">Exams scheduled for your class. Start one when it's marked Live.</p>
      <div id="cbt-empty-msg" class="cbt-empty" style="display:none;">No CBT exams are available for your class right now.</div>
      <div id="cbt-exam-list" class="cbt-exam-grid"></div>
    </div>

    <div id="cbt-exam-view" style="display:none;">
      <div class="cbt-exam-bar">
        <div id="cbt-exam-title">Question Paper</div>
        <div id="cbt-timer" class="cbt-timer">--:--</div>
      </div>
      <div id="cbt-questions"></div>
      <button class="cbt-submit-btn" onclick="confirmSubmit()">Submit Exam</button>
    </div>

    <div id="cbt-result-view" style="display:none;">
      <div class="cbt-result-card">
        <h2>Exam Submitted</h2>
        <div id="cbt-result-score"></div>
        <button class="cbt-btn" style="margin-top:18px;" onclick="showListView()">Back to Exams</button>
      </div>
    </div>
  </main>
  <script src="student-cbt.js"></script>
</body>
</html>
