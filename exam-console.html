<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Console — Unique Children's School</title>
<link rel="icon" type="image/png" href="/report_assets/favicon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root {
  --black: #ffffff; --black-2: #f8fafc; --black-3: #f1f5f9; --border: #e2e8f0; --border-2: #cbd5e1;
  --green: #16a34a; --green-bg: rgba(22,163,74,0.10); --red: #dc2626; --amber: #b45309;
  --text-1: #0f172a; --text-2: #475569; --text-3: #94a3b8; --radius-sm: 6px; --radius: 10px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--black-2); color: var(--text-1); font-family: 'DM Sans', sans-serif; font-size: 14px; }
.ec-top { display: flex; align-items: center; gap: 12px; padding: 14px 24px; background: #fff; border-bottom: 1px solid var(--border); }
.ec-top img { width: 38px; height: 38px; object-fit: contain; }
.ec-top h1 { margin: 0; font-size: 16px; }
.ec-top .sub { font-size: 12px; color: var(--text-3); }
.ec-top .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.ec-wrap { max-width: 1180px; margin: 24px auto; padding: 0 20px 40px; }
.ec-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 22px; margin-bottom: 18px; }
.ec-card h2 { margin: 0 0 6px; font-size: 16px; }
.ec-muted { color: var(--text-2); font-size: 13px; line-height: 1.55; }
.ec-hint { color: var(--text-3); font-size: 12px; }
.ec-field { margin-top: 14px; }
.ec-field label { display: block; font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); margin-bottom: 6px; }
.ec-input { width: 100%; max-width: 420px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--black-3); font: inherit; color: var(--text-1); outline: none; }
.ec-input:focus { border-color: rgba(34,197,94,.5); }
.post-btn, .btn-outline, .btn-danger { padding: 9px 16px; font-size: 13px; border-radius: 8px; }
.ec-address { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
.ec-address code { font-family: 'DM Mono', monospace; font-size: 20px; font-weight: 500; color: var(--green); background: var(--green-bg); padding: 8px 14px; border-radius: 8px; }
.ec-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
.ec-table th { text-align: left; font-size: 12px; color: var(--text-2); padding: 8px 10px; border-bottom: 2px solid var(--border); }
.ec-table td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.ec-pill { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; }
.ec-pill.live { background: var(--green-bg); color: var(--green); }
.ec-pill.upcoming { background: var(--black-3); color: var(--text-2); }
.ec-pill.closed { background: #fee2e2; color: var(--red); }
.ec-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.ec-actions button { padding: 6px 12px; font-size: 12px; }
.ec-row-active td { background: var(--green-bg); }
.ec-error { color: var(--red); font-size: 13px; margin-top: 10px; min-height: 18px; }
.ec-flex { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.ec-check { display: flex; gap: 8px; align-items: center; margin-top: 12px; font-size: 13px; color: var(--text-2); }
@media (max-width: 760px) { .ec-table { font-size: 12px; } .ec-hide-sm { display: none; } }
</style>
<link rel="stylesheet" href="ui-buttons.css">
</head>
<body>
  <div class="ec-top">
    <img src="/report_assets/favicon.png?v=2" alt="">
    <div><h1>Offline CBT — Exam Console</h1><div class="sub">Unique Children's School · runs on the school network, no internet needed</div></div>
    <div class="right" id="ec-top-actions"></div>
  </div>
  <div class="ec-wrap" id="ec-root"><div class="ec-card ec-muted">Loading…</div></div>
<script src="ui-dialog.js?v=3"></script>
<script src="exam-console.js?v=1"></script>
</body>
</html>
