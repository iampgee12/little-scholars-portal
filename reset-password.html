<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Scholars — Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --black:    #ffffff;
  --black-2:  #f8fafc;
  --black-3:  #f1f5f9;
  --black-4:  #e2e8f0;
  --border:   #e2e8f0;
  --border-2: #cbd5e1;
  --green:    #16a34a;
  --green-bg: rgba(22,163,74,0.08);
  --red:      #dc2626;
  --red-bg:   rgba(220,38,38,0.08);
  --text-1:   #0f172a;
  --text-2:   #475569;
  --text-3:   #94a3b8;
  --radius-sm: 8px;
  --radius:    14px;
  --transition: 0.18s ease;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { font-size:14px; }
body {
  font-family:'DM Sans',sans-serif;
  background:var(--black-2);
  color:var(--text-1);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  -webkit-font-smoothing:antialiased;
  padding:20px;
}
.card {
  width:100%; max-width:420px;
  background:var(--black);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:0 4px 24px rgba(15,23,42,0.08);
}
.card-top {
  padding:36px 32px 20px;
  display:flex; flex-direction:column;
  align-items:center; gap:8px;
  text-align:center;
}
.logo-mark {
  width:50px; height:50px;
  background:var(--green);
  border-radius:var(--radius-sm);
  display:flex; align-items:center; justify-content:center;
  font-size:18px; font-weight:900;
  color:#ffffff; letter-spacing:-1px;
}
.logo-name { font-size:15px; font-weight:700; color:var(--text-1); letter-spacing:-0.3px; }
.card-body { padding:8px 32px 32px; }
.title { font-size:16px; font-weight:700; margin-bottom:4px; text-align:center; }
.sub { font-size:12px; color:var(--text-3); margin-bottom:20px; text-align:center; }
.field { margin-bottom:14px; }
.field-label {
  display:block; font-size:11px; font-weight:600;
  color:var(--text-2); text-transform:uppercase;
  letter-spacing:0.3px; margin-bottom:6px;
}
.field-input {
  width:100%; background:var(--black-3);
  border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:11px 14px;
  font-family:'DM Sans',sans-serif; font-size:13px; color:var(--text-1);
  outline:none; transition:all var(--transition);
}
.field-input:focus {
  border-color:rgba(22,163,74,0.4); background:var(--black);
  box-shadow:0 0 0 3px rgba(22,163,74,0.07);
}
.alert {
  background:var(--red-bg); border:1px solid rgba(239,68,68,0.2);
  border-radius:var(--radius-sm);
  padding:9px 12px; margin-bottom:14px;
  font-size:12px; color:var(--red);
  font-family:'DM Mono',monospace;
  display:none;
}
.alert.show { display:block; }
.btn {
  width:100%; background:var(--green); color:#ffffff;
  border:none; border-radius:var(--radius-sm); padding:12px;
  font-family:'DM Sans',sans-serif; font-size:13px; font-weight:700;
  cursor:pointer; transition:all var(--transition);
}
.btn:hover { background:#15803d; }
.btn:disabled { opacity:0.65; cursor:not-allowed; }
.link { display:block; text-align:center; margin-top:16px; font-size:12px; color:var(--green); text-decoration:none; }
.link:hover { opacity:0.7; }
.success-icon {
  width:52px; height:52px; border-radius:50%;
  background:var(--green-bg); color:var(--green);
  display:flex; align-items:center; justify-content:center;
  margin:0 auto 14px;
}
.success-icon svg { width:26px; height:26px; }
.centered { text-align:center; }
</style>
</head>
<body>

<div class="card">
  <div class="card-top">
    <div class="logo-mark">LS</div>
    <div class="logo-name">Little Scholars Academy</div>
  </div>

  <div class="card-body">
    <div id="form-state">
      <div class="title">Set a new password</div>
      <div class="sub">Choose a new password for your account.</div>
      <div class="alert" id="alert"></div>
      <div class="field">
        <label class="field-label" for="pw1">New Password</label>
        <input type="password" id="pw1" class="field-input" autocomplete="new-password">
      </div>
      <div class="field">
        <label class="field-label" for="pw2">Confirm New Password</label>
        <input type="password" id="pw2" class="field-input" autocomplete="new-password">
      </div>
      <button class="btn" id="btn" onclick="submitReset()">Reset Password</button>
    </div>

    <div id="success-state" style="display:none;">
      <div class="success-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      </div>
      <div class="title centered">Password reset</div>
      <div class="sub">Your password has been changed. You can now sign in.</div>
      <a class="link" href="index.html" style="background:var(--green);color:#fff;display:block;padding:12px;border-radius:var(--radius-sm);text-decoration:none;font-weight:700;font-size:13px;">Go to Sign In</a>
    </div>

    <div id="invalid-state" style="display:none;">
      <div class="title centered">Link missing</div>
      <div class="sub">This reset link is incomplete. Please request a new one from the sign-in page.</div>
      <a class="link" href="index.html">Back to Sign In</a>
    </div>
  </div>
</div>

<script>
function getToken() {
  return new URLSearchParams(window.location.search).get('token') || '';
}

const token = getToken();
if (!token) {
  document.getElementById('form-state').style.display = 'none';
  document.getElementById('invalid-state').style.display = 'block';
}

async function submitReset() {
  const pw1 = document.getElementById('pw1').value;
  const pw2 = document.getElementById('pw2').value;
  const alertEl = document.getElementById('alert');
  const btn = document.getElementById('btn');

  alertEl.classList.remove('show');

  if (!pw1 || pw1.length < 4) {
    alertEl.textContent = 'Password must be at least 4 characters.';
    alertEl.classList.add('show');
    return;
  }
  if (pw1 !== pw2) {
    alertEl.textContent = 'Passwords do not match.';
    alertEl.classList.add('show');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Resetting...';
  try {
    const res = await fetch('/api/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, newPassword: pw1 }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Something went wrong.');
    document.getElementById('form-state').style.display = 'none';
    document.getElementById('success-state').style.display = 'block';
  } catch (err) {
    alertEl.textContent = err.message;
    alertEl.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Reset Password';
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && token) submitReset();
});
</script>
</body>
</html>
