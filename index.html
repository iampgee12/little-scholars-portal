<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Scholars — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --black:    #ffffff;
  --black-2:  #f8fafc;
  --black-3:  #f1f5f9;
  --black-4:  #e2e8f0;
  --border:   #e2e8f0;
  --border-2: #cbd5e1;
  --green:    #16a34a;
  --green-bg: rgba(22,163,74,0.08);
  --red:      #dc2626;
  --red-bg:   rgba(220,38,38,0.08);
  --amber:    #d97706;
  --amber-bg: rgba(217,119,6,0.08);
  --blue:     #2563eb;
  --blue-bg:  rgba(37,99,235,0.08);
  --text-1:   #0f172a;
  --text-2:   #475569;
  --text-3:   #94a3b8;
  --radius-sm: 8px;
  --radius:    14px;
  --transition: 0.18s ease;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { font-size:14px; }
body {
  font-family:'DM Sans',sans-serif;
  background:var(--black-2);
  color:var(--text-1);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  -webkit-font-smoothing:antialiased;
  position:relative;
  padding:20px;
}
body::before { display:none; }

/* ── CARD SHELL ── */
.login-card {
  position:relative; z-index:1;
  width:100%; max-width:420px;
  background:var(--black);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:0 4px 24px rgba(15,23,42,0.08);
}

/* ── STEPS ── */
.step { width:100%; }
.step.hidden { display:none; }

@keyframes stepIn  { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
@keyframes stepOut { from{opacity:1;transform:translateY(0)} to{opacity:0;transform:translateY(-14px)} }
@keyframes cardIn  { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }

.login-card { animation:cardIn 0.35s ease both; }
.step.anim-in  { animation:stepIn  0.32s cubic-bezier(0.4,0,0.2,1) both; }

/* ── SHARED CARD TOP ── */
.card-top {
  padding:44px 32px 36px;
  display:flex; flex-direction:column;
  align-items:center; gap:8px;
  text-align:center;
}
.logo-mark {
  width:50px; height:50px;
  background:var(--green);
  border-radius:var(--radius-sm);
  display:flex; align-items:center; justify-content:center;
  font-size:18px; font-weight:900;
  color:#ffffff; letter-spacing:-1px;
}
.logo-name { font-size:15px; font-weight:700; color:var(--text-1); letter-spacing:-0.3px; }
.logo-sub  { font-size:10px; color:var(--text-3); font-weight:500; letter-spacing:0.7px;
             text-transform:uppercase; font-family:'DM Mono',monospace; margin-top:-2px; }

/* ── STEP 1: ROLE SELECTOR ── */
.role-picker { padding:32px 28px 48px; display:flex; flex-direction:column; gap:24px; align-items:center; }

.role-picker-title {
  text-align:center;
}
.role-picker-title h2 { font-size:17px; font-weight:700; color:var(--text-1); }
.role-picker-title p  { font-size:12px; color:var(--text-3); margin-top:4px; }

.role-cards {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  width:100%;
}
.role-card {
  background:var(--black-3);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:20px 12px 16px;
  cursor:pointer;
  display:flex; flex-direction:column;
  align-items:center; gap:12px;
  transition:border-color 0.2s ease, background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
  position:relative;
  overflow:hidden;
}
.role-card:hover {
  border-color:var(--border-2);
  background:var(--black-4);
  transform:translateY(-2px);
  box-shadow:0 4px 12px rgba(15,23,42,0.08);
}
.role-card:active { transform:scale(0.97); }

.role-card-icon {
  width:52px; height:52px;
  border-radius:12px;
  display:flex; align-items:center; justify-content:center;
}
.role-card-icon svg { width:26px; height:26px; }

.role-card-label {
  font-size:12px; font-weight:600;
  letter-spacing:0.2px;
}

/* role accent colours */
.role-card[data-role="admin"]   .role-card-icon { background:var(--blue-bg); color:var(--blue); }
.role-card[data-role="admin"]   .role-card-label { color:var(--blue); }
.role-card[data-role="admin"]:hover { border-color:rgba(99,102,241,0.4); }

.role-card[data-role="teacher"] .role-card-icon { background:var(--amber-bg); color:var(--amber); }
.role-card[data-role="teacher"] .role-card-label { color:var(--amber); }
.role-card[data-role="teacher"]:hover { border-color:rgba(251,191,36,0.4); }

.role-card[data-role="student"] .role-card-icon { background:var(--green-bg); color:var(--green); }
.role-card[data-role="student"] .role-card-label { color:var(--green); }
.role-card[data-role="student"]:hover { border-color:rgba(34,197,94,0.4); }

/* ── STEP 2: LOGIN FORM ── */
.login-header {
  padding:26px 32px 22px;
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:14px;
}
.back-btn {
  background:var(--black-3); border:1px solid var(--border);
  border-radius:var(--radius-sm);
  width:34px; height:34px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; color:var(--text-2);
  transition:all var(--transition); flex-shrink:0;
  flex-shrink:0;
}
.back-btn:hover { border-color:var(--border-2); background:var(--black-4); color:var(--text-1); }
.back-btn svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.login-header-text { display:flex; flex-direction:column; gap:2px; }
.login-header-title { font-size:18px; font-weight:700; color:var(--text-1); letter-spacing:-0.4px; }
.login-header-sub   { font-size:12px; color:var(--text-3); }

.role-badge {
  margin-left:auto; flex-shrink:0;
  display:inline-flex; align-items:center;
  border-radius:20px; padding:3px 10px;
  font-size:10px; font-weight:700;
  font-family:'DM Mono',monospace; letter-spacing:0.4px;
}
.role-badge.admin   { color:var(--blue);  background:var(--blue-bg);  border:1px solid rgba(99,102,241,0.25); }
.role-badge.teacher { color:var(--amber); background:var(--amber-bg); border:1px solid rgba(251,191,36,0.25); }
.role-badge.student { color:var(--green); background:var(--green-bg); border:1px solid rgba(34,197,94,0.25); }

.card-body { padding:24px 32px 30px; }

.alert {
  background:var(--red-bg); border:1px solid rgba(239,68,68,0.2);
  border-radius:var(--radius-sm);
  padding:9px 12px; margin-bottom:18px;
  font-size:12px; color:var(--red);
  font-family:'DM Mono',monospace;
  display:none;
}
.alert.show { display:block; }

.field { margin-bottom:14px; }
.field-label {
  display:block; font-size:11px; font-weight:600;
  color:var(--text-2); text-transform:uppercase;
  letter-spacing:0.3px; margin-bottom:6px;
}
.input-wrap { position:relative; display:flex; align-items:center; }
.input-icon {
  position:absolute; left:12px;
  display:flex; align-items:center; pointer-events:none; color:var(--text-3);
}
.input-icon svg { width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.field-input {
  width:100%; background:var(--black-3);
  border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:11px 40px 11px 38px;
  font-family:'DM Sans',sans-serif; font-size:13px; color:var(--text-1);
  outline:none; transition:all var(--transition);
}
.field-input::placeholder { color:var(--text-3); }
.field-input:focus {
  border-color:rgba(22,163,74,0.4); background:var(--black);
  box-shadow:0 0 0 3px rgba(22,163,74,0.07);
}
.field-input.error { border-color:rgba(220,38,38,0.45); }
.field-error { font-size:11px; color:var(--red); margin-top:5px; font-family:'DM Mono',monospace; display:none; }
.field-error.show { display:block; }

.pw-toggle {
  position:absolute; right:10px; background:transparent; border:none;
  cursor:pointer; color:var(--text-3); padding:0;
  display:flex; align-items:center; transition:color var(--transition);
}
.pw-toggle:hover { color:var(--text-1); }
.pw-toggle svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

.row { display:flex; align-items:center; justify-content:space-between; margin:6px 0 20px; }
.forgot { font-size:12px; color:var(--green); text-decoration:none; font-weight:500; transition:opacity var(--transition); }
.forgot:hover { opacity:0.7; }

.signin-btn {
  width:100%; background:var(--green); color:#ffffff;
  border:none; border-radius:var(--radius-sm); padding:12px;
  font-family:'DM Sans',sans-serif; font-size:13px; font-weight:700;
  cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  transition:all var(--transition);
}
.signin-btn:hover { background:#15803d; }
.signin-btn:active { transform:scale(0.99); }
.signin-btn:disabled { opacity:0.65; cursor:not-allowed; transform:none; }

.spinner {
  width:13px; height:13px;
  border:2px solid rgba(0,0,0,0.25); border-top-color:var(--black);
  border-radius:50%; animation:spin 0.6s linear infinite; display:none;
}
@keyframes spin { to { transform:rotate(360deg); } }

/* ── REDIRECT OVERLAY ── */
.redirect-overlay {
  display:none; position:fixed; inset:0; z-index:100;
  background:rgba(255,255,255,0.96);
  backdrop-filter:blur(8px);
  align-items:center; justify-content:center;
  flex-direction:column; gap:14px;
}
.redirect-overlay.show { display:flex; animation:fadeIn 0.25s ease; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.redirect-spinner {
  width:28px; height:28px;
  border:2px solid var(--border); border-top-color:var(--green);
  border-radius:50%; animation:spin 0.7s linear infinite;
}
.redirect-text { font-size:12px; color:var(--text-3); font-family:'DM Mono',monospace; }
.redirect-role { font-size:11px; font-weight:700; font-family:'DM Mono',monospace; color:var(--text-1); }

::-webkit-scrollbar { width:4px; height:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border-2); border-radius:99px; }
</style>
</head>
<body>

<div class="login-card">

  <!-- ── STEP 1: ROLE PICKER ── -->
  <div class="step" id="step-select">
    <div class="card-top">
      <div class="logo-mark">LS</div>
      <div class="logo-name">Little Scholars Academy</div>
    </div>
    <div class="role-picker">
      <div class="role-picker-title">
        <h2>Welcome back</h2>
        <p>Select your account type to continue</p>
      </div>
      <div class="role-cards">

        <button class="role-card" data-role="admin" onclick="selectRole('admin')">
          <div class="role-card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3l8 4v5c0 4-3.3 7.7-8 9-4.7-1.3-8-5-8-9V7l8-4z"/>
            </svg>
          </div>
          <span class="role-card-label">Admin</span>
        </button>

        <button class="role-card" data-role="teacher" onclick="selectRole('teacher')">
          <div class="role-card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="13" rx="2"/>
              <path d="M8 21h8M12 17v4"/>
            </svg>
          </div>
          <span class="role-card-label">Staff</span>
        </button>

        <button class="role-card" data-role="student" onclick="selectRole('student')">
          <div class="role-card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 10l-10-6L2 10l10 6 10-6z"/>
              <path d="M6 12.5v4c0 1.7 2.7 3 6 3s6-1.3 6-3v-4"/>
            </svg>
          </div>
          <span class="role-card-label">Pupil</span>
        </button>

      </div>
    </div>
  </div>

  <!-- ── STEP 2: LOGIN FORM ── -->
  <div class="step hidden" id="step-login">
    <div class="login-header">
      <button class="back-btn" onclick="goBack()" aria-label="Back">
        <svg viewBox="0 0 24 24"><polyline points="15,18 9,12 15,6"/></svg>
      </button>
      <div class="login-header-text">
        <div class="login-header-title" id="login-title">Login</div>
        <div class="login-header-sub">Sign in to your account</div>
      </div>
    </div>

    <div class="card-body">
      <div class="alert" id="alert"></div>

      <div class="field">
        <label class="field-label" id="id-label" for="sid">ID</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          </span>
          <input type="text" id="sid" class="field-input" autocomplete="username">
        </div>
        <div class="field-error" id="sid-err">Please enter your ID.</div>
      </div>

      <div class="field">
        <label class="field-label" for="pw">Password</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="11" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          </span>
          <input type="password" id="pw" class="field-input" placeholder="Enter your password" autocomplete="current-password">
          <button type="button" class="pw-toggle" onclick="togglePw()" aria-label="Toggle password visibility">
            <svg id="eye-icon" viewBox="0 0 24 24">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <div class="field-error" id="pw-err">Please enter your password.</div>
      </div>

      <div class="row">
        <span></span>
        <a href="#" class="forgot">Forgot Password?</a>
      </div>

      <button class="signin-btn" id="btn" onclick="handleLogin()">
        <span id="btn-txt">Sign In</span>
        <span id="btn-arr">→</span>
        <div class="spinner" id="spin"></div>
      </button>
    </div>
  </div>

</div>

<!-- Redirect overlay -->
<div class="redirect-overlay" id="redirect-overlay">
  <div class="redirect-spinner"></div>
  <div class="redirect-role" id="redirect-role"></div>
  <div class="redirect-text">Redirecting to your portal…</div>
</div>

<script src="login.js"></script>
</body>
</html>
